<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 보드 1 연결 — 동시 조작용</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(160deg, #2c2c2c 0%, #2f1e1e 50%, #331a1a 60%, #231717 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.06) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 1.4em;
            margin-bottom: 10px;
        }
        .sub {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
            margin-bottom: 28px;
        }
        .serial-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }
        .serial-status {
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.4);
            color: #ef4444;
            border-radius: 10px;
            font-size: 0.95em;
        }
        .serial-status.connected { color: #22c55e; }
        .serial-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .serial-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }
        .serial-btn.connected { background: rgba(34, 197, 94, 0.3); border-color: rgba(34, 197, 94, 0.6); }
        .serial-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.95em;
            transition: background 0.2s;
        }
        .back-link:hover { background: rgba(255, 255, 255, 0.25); }
        .hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85em;
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 보드 1 연결</h1>
        <p class="sub">이 탭을 열어 두면 메인 탭(Future Interaction)에서 보내는 i/o/x 명령이 이 보드에 전달됩니다.</p>

        <div class="serial-controls">
            <div class="serial-status disconnected" id="serialStatus">연결 안됨</div>
            <button class="serial-btn" id="connectBtn">ESP32 연결</button>
            <button class="serial-btn" id="disconnectBtn" disabled>연결 해제</button>
        </div>

        <a href="/futureinteraction.html" class="back-link">← Future Interaction으로</a>

        <p class="hint">
            사용법: 이 탭에서 보드 1 연결 → 보드 2 연결 탭에서 보드 2 연결 → Future Interaction 탭에서 대화하기 실행 시 두 보드 모두 동시에 제어됩니다.
        </p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/SerialController.js"></script>
    <script>
        const socket = io();
        const serialController = new SerialController();
        const serialStatus = document.getElementById('serialStatus');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');

        serialController.onStatusChange = (connected) => {
            if (connected) {
                serialStatus.textContent = '보드 1 연결됨';
                serialStatus.classList.remove('disconnected');
                serialStatus.classList.add('connected');
                connectBtn.classList.add('connected');
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                serialStatus.textContent = '연결 안됨';
                serialStatus.classList.remove('connected');
                serialStatus.classList.add('disconnected');
                connectBtn.classList.remove('connected');
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        };

        connectBtn.addEventListener('click', async () => {
            const success = await serialController.connect();
            if (!success) {
                console.warn('[보드1] 연결 실패');
            }
        });

        disconnectBtn.addEventListener('click', async () => {
            await serialController.disconnect();
        });

        // Future Interaction 탭에서 브로드캐스트된 시리얼 명령 수신 → 이 탭에 연결된 보드로 전송
        socket.on('serial:command', (cmd) => {
            if (serialController.getConnectionStatus()) {
                serialController.sendCommand(cmd).then(success => {
                    if (success) console.log('[보드1] 명령 전송:', cmd);
                    else console.warn('[보드1] 명령 전송 실패:', cmd);
                });
            }
        });
    </script>
</body>
</html>
