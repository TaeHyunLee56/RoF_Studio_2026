<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비디오 + 소켓 디버깅 (i → tunnel, o → closing)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #eee;
        }
        .top-bar {
            flex-shrink: 0;
            display: flex;n
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .top-bar .header {
            margin-bottom: 0;
            padding: 0;
        }
        .top-bar .button-group {
            margin-bottom: 0;
            padding: 0;
        }
        .container {
            display: contents;
        }
        h1 {
            font-size: 0.85em;
            font-weight: 600;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            font-size: 0.75em;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.25); }
        .section-label {
            display: none;
        }
        .button-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 0;
            padding: 0;
        }
        .btn {
            padding: 5px 10px;
            font-size: 0.75em;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            color: white;
        }
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.95;
        }
        .btn-i {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }
        .btn-o {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        .btn-x {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }
        .video-wrap {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 0;
            background: #000;
            overflow: hidden;
        }
        .video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: rotate(270deg);
        }
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.95em;
        }
        .video-wrap video[data-active="true"] ~ .video-placeholder,
        .video-wrap video.active ~ .video-placeholder { display: none; }
        .log-line {
            flex-shrink: 0;
            padding: 4px 8px;
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Courier New', monospace;
        }
        .info-text {
            display: none;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="container">
            <div class="header">
                <h1>🎬 비디오 + 소켓 디버깅</h1>
                <a href="/serial-test.html" class="back-btn">← 시리얼 테스트</a>
            </div>
            <div class="section-label">소켓 전송 + 비디오</div>
            <div class="button-group">
                <button type="button" class="btn btn-i" id="btnI">i (tunnel)</button>
                <button type="button" class="btn btn-o" id="btnO">o (closing)</button>
                <button type="button" class="btn btn-x" id="btnX">x</button>
            </div>
        </div>
    </div>

    <div class="video-wrap">
        <video id="mainVideo" playsinline></video>
        <div class="video-placeholder" id="placeholder">i 또는 o 버튼을 누르면 비디오가 재생됩니다.</div>
    </div>
    <div class="log-line" id="logLine"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const mainVideo = document.getElementById('mainVideo');
        const placeholder = document.getElementById('placeholder');
        const logLine = document.getElementById('logLine');

        const TUNNEL_MP4 = '/assets/tunnel.mp4';
        const CLOSING_MP4 = '/assets/closing.mp4';

        function setLog(msg) {
            const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
            logLine.textContent = `[${time}] ${msg}`;
        }

        function playVideo(src, label) {
            mainVideo.classList.add('active');
            mainVideo.setAttribute('data-active', 'true');
            mainVideo.src = src;
            mainVideo.play().then(() => {
                setLog(`${label} 재생 중`);
            }).catch((e) => {
                setLog(`재생 오류: ${e.message}`);
            });
        }

        function stopVideo() {
            mainVideo.pause();
            mainVideo.removeAttribute('src');
            mainVideo.load();
            mainVideo.classList.remove('active');
            mainVideo.removeAttribute('data-active');
            setLog('비디오 정지');
        }

        document.getElementById('btnI').addEventListener('click', () => {
            socket.emit('serial:command', 'i');
            playVideo(TUNNEL_MP4, 'tunnel.mp4');
        });

        document.getElementById('btnO').addEventListener('click', () => {
            socket.emit('serial:command', 'o');
            playVideo(CLOSING_MP4, 'closing.mp4');
        });

        document.getElementById('btnX').addEventListener('click', () => {
            socket.emit('serial:command', 'x');
            stopVideo();
        });

        mainVideo.addEventListener('ended', () => {
            socket.emit('serial:command', 'x');
            setLog('재생 완료 → x 명령 전송 (LED 끄기)');
        });

        setLog('대기 중 — i / o / x 버튼을 누르세요.');
    </script>
</body>
</html>
