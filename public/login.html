<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoF Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #202020;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        #login {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: rgba(30, 30, 30, 0.95);
            border-top: 1px solid rgba(150, 150, 150, 0.15);
            backdrop-filter: blur(12px);
        }

        #login form {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        #login input {
            padding: 8px 12px;
            border: 1px solid rgba(150, 150, 150, 0.3);
            border-radius: 8px;
            font-size: 0.85em;
            background: rgba(131, 131, 131, 0.6);
            color: #f0f0f0;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        #login input:focus {
            outline: none;
            border-color: #A61A1E;
            box-shadow: 0 0 6px rgba(166, 26, 30, 0.3);
        }

        #login input::placeholder {
            color: #cccccc;
        }

        #login button {
            background: linear-gradient(45deg, #A61A1E, #A61A1E);
            color: white;
            border: none;
            padding: 10px 32px;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 3px 10px rgba(166, 26, 30, 0.4);
        }

        #login button:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(166, 26, 30, 0.6);
        }

        /* 시리얼 연결 버튼 스타일 */
        .serial-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .serial-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .serial-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .serial-btn.connected {
            background: rgba(34, 197, 94, 0.3);
            border-color: rgba(34, 197, 94, 0.6);
        }

        .serial-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .serial-status {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 8px;
            font-size: 0.85em;
            backdrop-filter: blur(10px);
        }

        .serial-status.connected {
            color: #22c55e;
        }

        .serial-status.disconnected {
            color: #ef4444;
        }

        .serial-controls.hidden {
            display: none;
        }

        /* 상단 사용자 바 */
        #userBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 0 12px;
            z-index: 900;
        }

        #userBar h3 {
            color: #aaa;
            font-size: 0.75em;
            margin: 0 0 10px 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .user-items {
            display: flex;
            flex-direction: row;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0 20px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .user-items::-webkit-scrollbar {
            height: 3px;
        }

        .user-items::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.3);
            border-radius: 2px;
        }

        .user-card {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            background: rgba(131, 131, 131, 0.2);
            border: 1px solid rgba(150, 150, 150, 0.2);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            scroll-snap-align: start;
            user-select: none;
        }

        .user-card:hover {
            background: rgba(166, 26, 30, 0.2);
            border-color: rgba(166, 26, 30, 0.5);
            transform: translateY(-2px);
        }

        .user-card:active {
            transform: scale(0.96);
        }

        .user-card .user-name {
            color: #f0f0f0;
            font-size: 0.88em;
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            max-width: 85px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-card .user-birth {
            color: #888;
            font-size: 0.68em;
            white-space: nowrap;
        }

        .user-card.loading-card {
            cursor: default;
            color: #888;
            font-size: 0.78em;
            width: 200px;
        }

        .user-card.loading-card:hover {
            background: rgba(131, 131, 131, 0.2);
            border-color: rgba(150, 150, 150, 0.2);
            transform: none;
        }
    </style>
</head>
<body>
    <!-- 시리얼 연결 컨트롤 (Q키로 토글) -->
    <div class="serial-controls hidden">
        <div class="serial-status disconnected" id="serialStatus">연결 안됨</div>
        <button class="serial-btn" id="connectBtn">ESP32 연결</button>
        <button class="serial-btn" id="serialTestBtn">시리얼 통신 테스트</button>
        <button class="serial-btn" id="disconnectBtn" disabled>연결 해제</button>
    </div>

    <div id="login">
        <form id="loginForm" method="POST" action="/login">
            <input
                type="text"
                id="userId"
                name="userId"
                placeholder="이름을 입력하세요"
                required
                autofocus
            >
            <input
                type="text"
                id="password"
                name="password"
                placeholder="생년월일 6자리 (예: 990315)"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                required
            >
            <button type="submit">로그인</button>
        </form>
    </div>

    <div id="userBar">
        <h3>최근 사용자</h3>
        <div class="user-items" id="userItems">
            <div class="user-card loading-card">불러오는 중...</div>
        </div>
    </div>

    <script src="/js/SerialController.js"></script>
    <script type="module">
        // 최근 사용자 목록 로드
        async function loadUserList() {
            const container = document.getElementById('userItems');
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                if (!data.success || !data.users.length) {
                    container.innerHTML = '<div class="user-card loading-card">등록된 사용자 없음</div>';
                    return;
                }
                container.innerHTML = '';
                data.users.forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'user-card';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'user-name';
                    nameSpan.textContent = user.name;

                    const birthSpan = document.createElement('span');
                    birthSpan.className = 'user-birth';
                    if (user.birth) {
                        const y = user.birth.substring(0, 2);
                        const m = user.birth.substring(2, 4);
                        const d = user.birth.substring(4, 6);
                        birthSpan.textContent = `${y}.${m}.${d}`;
                    } else {
                        birthSpan.textContent = '-';
                    }

                    card.appendChild(nameSpan);
                    card.appendChild(birthSpan);
                    card.addEventListener('click', () => adminLogin(user.id));
                    container.appendChild(card);
                });
            } catch (e) {
                console.error('유저 목록 로드 실패:', e);
                container.innerHTML = '<div class="user-card loading-card">불러오기 실패</div>';
            }
        }

        async function adminLogin(internalId) {
            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ internalId }),
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirectUrl;
                } else {
                    alert(data.message || '로그인 실패');
                }
            } catch (e) {
                console.error('관리자 로그인 오류:', e);
                alert('로그인 중 오류가 발생했습니다.');
            }
        }

        loadUserList();

        // SerialController 인스턴스 생성
        const serialController = new SerialController();

        // 시리얼 UI 요소
        const serialControls = document.querySelector('.serial-controls');
        const connectBtn = document.getElementById('connectBtn');
        const serialTestBtn = document.getElementById('serialTestBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const serialStatus = document.getElementById('serialStatus');

        // 시리얼 연결 버튼 이벤트
        connectBtn.addEventListener('click', async () => {
            const success = await serialController.connect();
            if (success) {
                serialStatus.textContent = '연결됨';
                serialStatus.classList.remove('disconnected');
                serialStatus.classList.add('connected');
                connectBtn.classList.add('connected');
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                alert('ESP32 연결에 실패했습니다. 다시 시도해주세요.');
            }
        });

        // 시리얼 통신 테스트 버튼 이벤트
        serialTestBtn.addEventListener('click', () => {
            window.location.href = '/serial-test.html';
        });

        // 시리얼 연결 해제 버튼 이벤트
        disconnectBtn.addEventListener('click', async () => {
            await serialController.disconnect();
            serialStatus.textContent = '연결 안됨';
            serialStatus.classList.remove('connected');
            serialStatus.classList.add('disconnected');
            connectBtn.classList.remove('connected');
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        });

        // Q 키로 시리얼 디버깅 패널 토글
        let isSerialPanelVisible = false;
        document.addEventListener('keydown', (event) => {
            // Q 키 또는 q 키를 눌렀을 때
            if (event.key === 'q' || event.key === 'Q') {
                // 입력 필드에 포커스가 있으면 무시 (예: 텍스트 입력 중)
                if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                    return;
                }
                
                isSerialPanelVisible = !isSerialPanelVisible;
                if (isSerialPanelVisible) {
                    serialControls.classList.remove('hidden');
                    console.log('[디버깅] 시리얼 패널 표시');
                } else {
                    serialControls.classList.add('hidden');
                    console.log('[디버깅] 시리얼 패널 숨김');
                }
            }
        });
    </script>
</body>
</html>
